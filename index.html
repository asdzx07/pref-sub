<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优选 IP 订阅生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { color: #e8912d; margin-bottom: 6px; font-size: 24px; }
  .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .field textarea { min-height: 120px; font-family: monospace; font-size: 13px; resize: vertical; }
  .btn { padding: 9px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #e8912d; color: #fff; }
  .btn-primary:hover { background: #d1801f; }
  .btn-blue { background: #1a9bf0; color: #fff; }
  .btn-green { background: #22b573; color: #fff; }
  .btn-gray { background: #eee; color: #666; }
  .output-box { background: #f8f9fb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .output-box .label { font-size: 13px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .output-box textarea { width: 100%; min-height: 80px; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; background: #fff; }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  #qrcode { text-align: center; padding: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { padding: 8px 16px; border-radius: 8px; background: #eee; cursor: pointer; font-size: 14px; border: none; }
  .tab.active { background: #e8912d; color: #fff; }
  .hidden { display: none; }
  .node-info { background: #f0f7ff; border: 1px solid #cfe3ff; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>🚀 优选 IP 订阅生成器</h1>
  <p class="subtitle">为 VLESS+WS+TLS 节点批量生成优选 IP 订阅 · 配置保存在浏览器本地</p>

  <!-- 节点配置 -->
  <div class="card">
    <h2>📝 节点配置</h2>
    <div class="row">
      <div class="field">
        <label>订阅 URL（sb-onekey 的 v2rayn 订阅地址，一键导入）</label>
        <input type="text" id="subUrl" placeholder="http://IP:端口/token/v2rayn">
      </div>
      <div class="field" style="flex:0; align-self:flex-end;">
        <button class="btn btn-blue" onclick="importFromSub()">导入</button>
      </div>
    </div>
    <div class="node-info hidden" id="nodeInfo"></div>
    <div class="row">
      <div class="field"><label>UUID</label><input type="text" id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
      <div class="field"><label>域名 (HOST / SNI)</label><input type="text" id="host" placeholder="example.com"></div>
    </div>
    <div class="row">
      <div class="field"><label>端口</label><input type="text" id="port" value="443"></div>
      <div class="field"><label>WS 路径</label><input type="text" id="path" placeholder="/xxxx"></div>
      <div class="field"><label>订阅名称</label><input type="text" id="subName" value="pref-ip"></div>
    </div>
    <div class="row">
      <button class="btn btn-gray" onclick="saveConfig()">💾 保存配置</button>
      <span class="hint">配置自动保存到浏览器，下次打开直接用</span>
    </div>
  </div>

  <!-- 优选 IP -->
  <div class="card">
    <h2>⚡️ 优选 IP 列表</h2>
    <div class="field">
      <label>一行一个，格式：<code>IP:端口#备注</code>（端口默认443，备注可选）</label>
      <textarea id="ipList" placeholder="104.16.0.1:443#电信优选&#10;172.67.0.1:8443#联通优选&#10;162.159.0.1"></textarea>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-green" onclick="generate()">⚡️ 生成订阅</button>
      <button class="btn btn-gray" onclick="clearIPs()">清空</button>
    </div>
  </div>

  <!-- 输出 -->
  <div class="card hidden" id="outputCard">
    <h2>📋 生成结果 <span id="nodeCount" style="font-size:13px;color:#888;"></span></h2>
    <div class="tabs">
      <button class="tab active" onclick="showTab('vless')">VLESS 链接</button>
      <button class="tab" onclick="showTab('base64')">Base64 订阅</button>
      <button class="tab" onclick="showTab('clash')">Clash 订阅</button>
      <button class="tab" onclick="showTab('singbox')">sing-box 订阅</button>
    </div>
    <div class="output-box" id="tab-vless">
      <div class="label">VLESS 链接 <button class="btn btn-blue btn-sm" onclick="copyText('out-vless')">复制</button></div>
      <textarea id="out-vless" readonly></textarea>
    </div>
    <div class="output-box hidden" id="tab-base64">
      <div class="label">Base64 订阅内容 <button class="btn btn-blue btn-sm" onclick="copyText('out-base64')">复制</button></div>
      <textarea id="out-base64" readonly></textarea>
      <div id="qrcode"></div>
    </div>
    <div class="output-box hidden" id="tab-clash">
      <div class="label">Clash YAML <button class="btn btn-blue btn-sm" onclick="copyText('out-clash')">复制</button></div>
      <textarea id="out-clash" readonly style="min-height:200px;"></textarea>
    </div>
    <div class="output-box hidden" id="tab-singbox">
      <div class="label">sing-box JSON <button class="btn btn-blue btn-sm" onclick="copyText('out-singbox')">复制</button></div>
      <textarea id="out-singbox" readonly style="min-height:200px;"></textarea>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ---------- 配置存取 ----------
function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem('prefsub_config') || '{}');
    if (c.uuid) document.getElementById('uuid').value = c.uuid;
    if (c.host) document.getElementById('host').value = c.host;
    if (c.port) document.getElementById('port').value = c.port;
    if (c.path) document.getElementById('path').value = c.path;
    if (c.subName) document.getElementById('subName').value = c.subName;
    if (c.ipList) document.getElementById('ipList').value = c.ipList;
  } catch(e) {}
}
function saveConfig(silent) {
  const c = {
    uuid: document.getElementById('uuid').value.trim(),
    host: document.getElementById('host').value.trim(),
    port: document.getElementById('port').value.trim() || '443',
    path: document.getElementById('path').value.trim(),
    subName: document.getElementById('subName').value.trim() || 'pref-ip',
    ipList: document.getElementById('ipList').value
  };
  localStorage.setItem('prefsub_config', JSON.stringify(c));
  if (!silent) alert('已保存');
  return c;
}

// ---------- 从订阅导入 ----------
async function importFromSub() {
  const url = document.getElementById('subUrl').value.trim();
  if (!url) { alert('请先填写订阅 URL'); return; }
  try {
    const resp = await fetch(url);
    const text = await resp.text();
    // 尝试 base64 解码
    let decoded = text;
    try { decoded = atob(text.trim()); } catch(e) {}
    const lines = decoded.split('\n').map(l => l.trim()).filter(l => l.startsWith('vless://'));
    if (!lines.length) { alert('订阅中没有找到 vless 链接'); return; }
    // 取第一条解析
    const link = lines[0];
    const m = link.match(/^vless:\/\/([^@]+)@([^:\/?#]+):(\d+)\/?\?([^#]*)#?(.*)$/);
    if (!m) { alert('解析失败'); return; }
    const params = new URLSearchParams(m[4]);
    document.getElementById('uuid').value = m[1];
    document.getElementById('port').value = m[3];
    document.getElementById('path').value = params.get('path') || '/';
    // host/sni 优先用 sni 参数
    document.getElementById('host').value = params.get('sni') || params.get('host') || m[2];
    const info = document.getElementById('nodeInfo');
    info.classList.remove('hidden');
    info.innerHTML = `✅ 已导入 ${lines.length} 个节点（使用第 1 个的参数）：UUID=${m[1].substring(0,8)}... host=${params.get('sni')||m[2]} path=${params.get('path')||'/'}`;
    saveConfig(true);
  } catch(e) {
    alert('导入失败：' + e.message + '\n（如是跨域问题，请手动填写）');
  }
}

// ---------- 解析 IP 列表 ----------
function parseIPs() {
  const text = document.getElementById('ipList').value;
  const result = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t || t.startsWith('#')) continue;
    // 格式：IP:端口#备注 或 IP#备注 或 IP:端口 或 IP
    let addr = t, label = '';
    const hashIdx = t.indexOf('#');
    if (hashIdx >= 0) { addr = t.substring(0, hashIdx).trim(); label = t.substring(hashIdx+1).trim(); }
    let ip = addr, port = document.getElementById('port').value.trim() || '443';
    const colonIdx = addr.lastIndexOf(':');
    // 处理 IPv6（方括号）简单情况
    if (colonIdx > 0 && !addr.endsWith(']')) {
      const maybePort = addr.substring(colonIdx+1);
      if (/^\d+$/.test(maybePort)) { ip = addr.substring(0, colonIdx); port = maybePort; }
    }
    if (!label) label = ip;
    result.push({ ip, port, label });
  }
  return result;
}

// ---------- 生成 ----------
function generate() {
  const cfg = saveConfig(true);
  if (!cfg.uuid || !cfg.host) { alert('请先填写 UUID 和域名'); return; }
  const ips = parseIPs();
  if (!ips.length) { alert('请先填写优选 IP 列表'); return; }

  // VLESS 链接
  const vlessLinks = ips.map(({ip, port, label}) => {
    const p = new URLSearchParams({
      security: 'tls', sni: cfg.host, type: 'ws',
      path: cfg.path || '/', host: cfg.host,
      fp: 'chrome', encryption: 'none'
    });
    return `vless://${cfg.uuid}@${ip}:${port}?${p.toString()}#${encodeURIComponent(label)}`;
  });

  document.getElementById('out-vless').value = vlessLinks.join('\n');
  document.getElementById('nodeCount').textContent = `共 ${ips.length} 个节点`;

  // Base64
  const b64 = btoa(unescape(encodeURIComponent(vlessLinks.join('\n'))));
  document.getElementById('out-base64').value = b64;

  // 二维码（data URI 方式，避免过长）
  document.getElementById('qrcode').innerHTML = '';
  try {
    new QRCode(document.getElementById('qrcode'), { text: 'data:text/plain;base64,' + b64.substring(0,200), width: 120, height: 120 });
  } catch(e) {}

  // Clash
  let clash = 'proxies:\n';
  ips.forEach(({ip, port, label}, i) => {
    clash += `  - name: "${label}"\n    type: vless\n    server: ${ip}\n    port: ${port}\n    uuid: ${cfg.uuid}\n    udp: true\n    tls: true\n    servername: ${cfg.host}\n    network: ws\n    ws-opts:\n      path: ${cfg.path || '/'}\n      headers:\n        Host: ${cfg.host}\n`;
  });
  clash += `\nproxy-groups:\n  - name: "优选"\n    type: url-test\n    proxies:\n${ips.map(({label}) => `      - "${label}"`).join('\n')}\n    url: https://www.gstatic.com/generate_204\n    interval: 300\n\nrules:\n  - MATCH,优选\n`;
  document.getElementById('out-clash').value = clash;

  // sing-box
  const outbounds = ips.map(({ip, port, label}) => ({
    type: 'vless', tag: label, server: ip, server_port: parseInt(port),
    uuid: cfg.uuid,
    tls: { enabled: true, server_name: cfg.host, utls: { enabled: true, fingerprint: 'chrome' } },
    transport: { type: 'ws', path: cfg.path || '/', headers: { Host: cfg.host } }
  }));
  outbounds.push({ type: 'direct', tag: 'direct' });
  const sb = {
    log: { level: 'info' },
    outbounds,
    route: { rules: [], final: outbounds[0].tag }
  };
  document.getElementById('out-singbox').value = JSON.stringify(sb, null, 2);

  document.getElementById('outputCard').classList.remove('hidden');
  showTab('vless');
  document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  ['vless','base64','clash','singbox'].forEach(n => {
    document.getElementById('tab-'+n).classList.toggle('hidden', n !== name);
  });
}
function copyText(id) {
  const el = document.getElementById(id);
  el.select();
  document.execCommand('copy');
  alert('已复制');
}
function clearIPs() {
  if (confirm('清空优选 IP 列表？')) document.getElementById('ipList').value = '';
}

loadConfig();
</script>
</body>
</html>
